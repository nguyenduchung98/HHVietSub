name: CI

on:
  push:
    branches:
      - main
      - codex/lite
  pull_request:

permissions:
  contents: read

jobs:
  validate-lite:
    name: Validate HHVietSub Lite
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation suite
        run: pnpm test

      - name: Build web application
        run: pnpm run build:web
